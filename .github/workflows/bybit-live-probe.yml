name: Bybit Live Probe

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Public Bybit symbol"
        required: true
        default: "BTCUSDT"
      category:
        description: "Bybit public market-data category"
        required: true
        default: "linear"
        type: choice
        options:
          - linear
          - inverse
          - spot
      timeframe:
        description: "Fixed-duration Kline interval"
        required: true
        default: "60"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "15"
          - "30"
          - "60"
          - "120"
          - "240"
          - "360"
          - "720"
      limit:
        description: "Number of public Kline rows to request"
        required: true
        default: "5"
      timeout:
        description: "HTTP timeout in seconds"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Call Bybit public Kline API
        run: >-
          python scripts/bybit_live_probe.py
          --symbol "${{ inputs.symbol }}"
          --category "${{ inputs.category }}"
          --timeframe "${{ inputs.timeframe }}"
          --limit "${{ inputs.limit }}"
          --timeout "${{ inputs.timeout }}"
