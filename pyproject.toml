[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabdeal-futures-signal-bot"
version = "0.1.0"
description = "Deterministic crypto perpetual-futures signal and alert engine."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
